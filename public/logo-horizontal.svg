<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="logo-horizontal-title logo-horizontal-desc">
  <title id="logo-horizontal-title">Logo horizontal de La tiendita de Diego</title>
